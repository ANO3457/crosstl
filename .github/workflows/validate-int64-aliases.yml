name: Validate CUDA HIP int64 aliases
on:
  push:
    branches: [validation/int64-aliases-3189]
    paths: [.github/workflows/validate-int64-aliases.yml]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: df04b8974630322487f968b32b0547a12474fbc8
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install official test dependencies
        run: python -m pip install -e ".[test]" black==26.10.1 isort==9.0.2 ruff
      - name: Check changed Python style
        run: |
          black --diff --preview --target-version=py38 tests/test_translator/test_cuda_hip_64bit_aliases.py
          black --check --preview --target-version=py38 crosstl/translator/codegen/cuda_codegen.py crosstl/translator/codegen/hip_codegen.py tests/test_translator/test_cuda_hip_64bit_aliases.py
          isort --check-only --profile=black crosstl/translator/codegen/cuda_codegen.py crosstl/translator/codegen/hip_codegen.py tests/test_translator/test_cuda_hip_64bit_aliases.py
          ruff check --select=E9,F63,F7,F82 --target-version=py38 crosstl/translator/codegen/cuda_codegen.py crosstl/translator/codegen/hip_codegen.py tests/test_translator/test_cuda_hip_64bit_aliases.py
      - name: Reproduce the unchanged baseline failures
        run: |
          cp crosstl/translator/codegen/cuda_codegen.py "$RUNNER_TEMP/cuda.py"
          cp crosstl/translator/codegen/hip_codegen.py "$RUNNER_TEMP/hip.py"
          trap 'cp "$RUNNER_TEMP/cuda.py" crosstl/translator/codegen/cuda_codegen.py; cp "$RUNNER_TEMP/hip.py" crosstl/translator/codegen/hip_codegen.py' EXIT
          git show e62a31537398c7fa894a586d611e696e5ba916d0:crosstl/translator/codegen/cuda_codegen.py > crosstl/translator/codegen/cuda_codegen.py
          git show e62a31537398c7fa894a586d611e696e5ba916d0:crosstl/translator/codegen/hip_codegen.py > crosstl/translator/codegen/hip_codegen.py
          set +e
          python -m pytest -q tests/test_translator/test_cuda_hip_64bit_aliases.py --junitxml=baseline.xml
          status=$?
          set -e
          test "$status" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("baseline.xml").getroot()
          assert len(root.findall(".//testcase")) == 6
          assert len(root.findall(".//failure")) == 6
          assert not root.findall(".//error")
          assert not root.findall(".//skipped")
          PY
      - name: Verify the fix and adjacent translation suites
        run: |
          python -m pytest -q -n 4 --dist loadfile             tests/test_translator/test_cuda_hip_64bit_aliases.py             tests/test_translator/test_hub_64bit_integers.py             tests/test_translator/test_codegen/test_CUDA_codegen.py             tests/test_translator/test_codegen/test_hip_codegen.py             tests/test_backend/test_CUDA tests/test_backend/test_HIP             --junitxml=fixed.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: int64-alias-test-evidence
          path: |
            baseline.xml
            fixed.xml
