name: Codex Mojo comparison validation
on:
  push:
    branches: [validation/codex25-mojo3071]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[test]'
      - name: Install the repository-pinned Mojo compiler
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/mojo"
          cat > "$RUNNER_TEMP/mojo-requirements.txt" <<'EOF'
          mojo-compiler==1.2.0 --hash=sha256:3ee34a3b26c6cccaa9523a0e8db8f67bea954497d782d97c9e61c3c4ecbdac7b
          mojo-compiler-mojo-libs==1.2.0 --hash=sha256:3d631f7e798c11d0029c4a892ebae1f5742751fac0c526af74b45a8ae07c3acb
          max-mojo-libs==26.7.0 --hash=sha256:c9eeaef01a19565b8467da9c6b7cd57fa787759ce5954140b0e031d095c630b9
          EOF
          "$RUNNER_TEMP/mojo/bin/pip" install --quiet --no-deps --require-hashes -r "$RUNNER_TEMP/mojo-requirements.txt"
          echo "$RUNNER_TEMP/mojo/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/mojo/bin/mojo" --version
      - name: Translate and execute the new public regressions
        run: '"${{ env.pythonLocation }}/bin/python" -m pytest tests/test_translator/test_mojo_vector_comparison_types.py -q --tb=short --junitxml=native.xml'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-comparison-results
          path: native.xml
