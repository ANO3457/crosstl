name: Validate Slang helper parameter directions
on:
  push:
    branches: [validation/slang-directions-3215]
    paths: [.github/workflows/validate-slang-directions.yml]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1d71e7301187dbe76423958be6c2c495626b08da
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -e ".[test]" black==26.10.1 isort==9.0.2 ruff
      - name: Check changed Python style
        run: |
          black --diff --preview --target-version=py38 tests/test_backend/test_slang/test_slang_parameter_directions.py
          black --check --preview --target-version=py38 crosstl/backend/slang/SlangCrossGLCodeGen.py tests/test_backend/test_slang/test_slang_parameter_directions.py
          isort --check-only --profile=black crosstl/backend/slang/SlangCrossGLCodeGen.py tests/test_backend/test_slang/test_slang_parameter_directions.py
          ruff check --select=E9,F63,F7,F82 --target-version=py38 crosstl/backend/slang/SlangCrossGLCodeGen.py tests/test_backend/test_slang/test_slang_parameter_directions.py
      - name: Reproduce original failures and plain-parameter control
        run: |
          cp crosstl/backend/slang/SlangCrossGLCodeGen.py "$RUNNER_TEMP/fixed.py"
          trap 'cp "$RUNNER_TEMP/fixed.py" crosstl/backend/slang/SlangCrossGLCodeGen.py' EXIT
          git show e62a31537398c7fa894a586d611e696e5ba916d0:crosstl/backend/slang/SlangCrossGLCodeGen.py > crosstl/backend/slang/SlangCrossGLCodeGen.py
          set +e
          python -m pytest -q tests/test_backend/test_slang/test_slang_parameter_directions.py --junitxml=baseline.xml
          status=$?
          set -e
          test "$status" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("baseline.xml").getroot()
          assert len(root.findall(".//testcase")) == 4
          assert len(root.findall(".//failure")) == 3
          assert not root.findall(".//error")
          assert not root.findall(".//skipped")
          PY
      - name: Test fixed behavior and adjacent Slang suites
        run: |
          python -m pytest -q -n 4 --dist loadfile             tests/test_backend/test_slang             tests/test_translator/test_codegen/test_slang_codegen.py             --junitxml=fixed.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slang-direction-test-evidence
          path: |
            baseline.xml
            fixed.xml
