name: Codex MLX trigger validation
on:
  push:
    branches: [validation/codex25-mlx2957]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[test]' black==26.10.1 isort==9.0.2 ruff==0.17.0
      - name: Focus and adjacent CI suites
        run: python -m pytest -q tests/test_ci_workflows.py tests/test_workflow_text.py tests/test_metal_toolchain_setup.py tests/test_tool_cli.py tests/test_demo_layout.py tests/test_compile_artifact_bundle.py tests/test_ci_helpers.py demos/integrations/mlx/tests/test_ci.py demos/integrations/mlx/tests/test_ci_native_selection.py demos/integrations/mlx/tests/test_ci_plan.py --junitxml=validation.xml
      - name: Changed Python formatting and lint
        run: |
          python -m black --check --preview --target-version py38 demos/integrations/mlx/ci_plan.py demos/integrations/mlx/tests/test_ci.py demos/integrations/mlx/tests/test_ci_plan.py
          python -m isort --profile black --check-only demos/integrations/mlx/ci_plan.py demos/integrations/mlx/tests/test_ci.py demos/integrations/mlx/tests/test_ci_plan.py
          python -m ruff check --select E9,F63,F7,F82 demos/integrations/mlx/ci_plan.py demos/integrations/mlx/tests/test_ci.py demos/integrations/mlx/tests/test_ci_plan.py
          git diff --check 4a472554 06f9003f
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: validation
          path: validation.xml

